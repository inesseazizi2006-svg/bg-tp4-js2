<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD-Persons - Etape 6</title>
    <link rel="stylesheet" href="style.css">
    <!-- Script externe (cours slide 24), "defer" = exécuté après le chargement du DOM (cours slide 27) -->
    <script src="script.js" defer></script>
</head>
<body>
    <!-- Conteneur du tableau : sert à le centrer et à fixer la police (TP slide 10) -->
    <div id="table_container">
        <!-- Formulaire de saisie d'une nouvelle personne (TP slide 48) -->
        <div id="form_container">
            <div class="form_group">
                <label class="form_label">Nom:</label>
                <input type="text" id="form_nom" class="form_field"/>
            </div>
            <div class="form_group">
                <label class="form_label">Prénom:</label>
                <input type="text" id="form_prenom" class="form_field"/>
            </div>
            <div class="form_group">
                <label class="form_label">Points:</label>
                <input type="number" id="form_points" class="form_field"/>
            </div>
            <!-- Au clic : appel de doNewData() qui lit les champs de saisie (TP slide 51) -->
            <button class="btn-add" onclick="doNewData()">
                Ajouter
            </button>
        </div>

        <!-- Fonctionnalité supplémentaire 3 : recherche en direct par nom ou prénom -->
        <div id="search_container">
            <input type="text" id="search_field" placeholder="Rechercher par nom ou prénom..."/>
        </div>

        <table>
            <!-- en-tête du tableau -->
            <thead>
                <tr>
                    <th class="col_number">N°</th>
                    <th class="col_text">Nom</th>
                    <th class="col_text">Prénom</th>
                    <th class="col_number">Points</th>
                    <th class="col_chkbox">Select</th>
                </tr>
            </thead>

            <!-- corps du tableau : vide, les lignes sont insérées par JavaScript à partir du tableau "persons" -->
            <tbody id="table_body">
            </tbody>
        </table>

        <!-- Espace résumé : nombre de lignes et total des points (TP slide 33) -->
        <div id="container_summary">
            <p id="p1">0 ligne(s)</p>
            <p id="p2"></p>
            <p id="p3">Totale point(s)= 0</p>
        </div>

        <!-- Conteneur des boutons, identifiant "container_btn" (TP slide 63) -->
        <div id="container_btn">
            <!-- Fonctionnalité supplémentaire 2 : modifier la ligne sélectionnée -->
            <button class="btn-edit" onclick="editRow()">Modifier</button>
            <!-- Console Tableau : affiche le tableau "persons" dans la console (TP slide 30) -->
            <button class="btn-consol" onclick="consoleTableau()">Console Tableau</button>
            <!-- Supprimer : supprime les lignes cochées, au clic appelle deleteRow() (TP slide 60) -->
            <button class="btn-del" onclick="deleteRow()">Supprimer</button>
        </div>
    </div>
</body>
</html>
